<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Transparent background for easy UI integration -->
  <rect width="400" height="300" fill="none" />
  
  <!-- Minimalist Logo Mark: Road converging to a source point -->
  <g transform="translate(0, -10)">
      <!-- Left side of road / pathway (Blue) -->
      <path d="M 160 160 C 160 120, 185 100, 200 90" fill="none" stroke="#2563EB" stroke-width="14" stroke-linecap="round" />
      <!-- Right side of road / pathway (Teal/Green) -->
      <path d="M 240 160 C 240 120, 215 100, 200 90" fill="none" stroke="#0D9488" stroke-width="14" stroke-linecap="round" />
      <!-- Sourcing Node / Central Point -->
      <circle cx="200" cy="85" r="14" fill="#1E293B" />
      <!-- Inner pulse dot -->
      <circle cx="200" cy="85" r="4" fill="#FFFFFF" />
      <!-- Upward extraction / placement line -->
      <path d="M 200 65 L 200 45" fill="none" stroke="#2563EB" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- App Name -->
  <text x="200" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">RoadSource</text>
  
  <!-- Subtitle -->
  <text x="200" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="2">POWERED BY IT ROAD</text>
</svg>
